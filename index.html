<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#3d8bff">
<title>Fliperama do X: primeiras contas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --paper:#f6faff; --grid:#dae7f5; --margin:#ffc2d1;
  --card:#ffffff; --ink:#1f2a4d; --soft:#5d6890; --sh:rgba(31,42,77,.16);
  --yellow:#ffc93c; --yellow-d:#c9971a;
  --pink:#ff5c8a; --pink-d:#c7365f;
  --blue:#3d8bff; --blue-d:#2160c4;
  --green:#2fcf86; --green-d:#1b9460;
  --orange:#ff8c42; --orange-d:#cf6420;
  --red:#ff4d5e;
  --t-pink:#ffe3eb; --t-blue:#e2eeff; --t-green:#dcf8ea; --t-yellow:#fff3cf;
  --font:'Baloo 2','Trebuchet MS',Verdana,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --paper:#141c36; --grid:#1e2849; --margin:#53284a;
    --card:#1d2849; --ink:#eef3ff; --soft:#aab4d8; --sh:rgba(0,0,0,.45);
    --t-pink:#3d2346; --t-blue:#1d3262; --t-green:#173f3a; --t-yellow:#3d3622;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --paper:#141c36; --grid:#1e2849; --margin:#53284a;
  --card:#1d2849; --ink:#eef3ff; --soft:#aab4d8; --sh:rgba(0,0,0,.45);
  --t-pink:#3d2346; --t-blue:#1d3262; --t-green:#173f3a; --t-yellow:#3d3622;
}
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ height:100%; margin:0; }
body{
  font-family:var(--font); color:var(--ink); overflow:hidden; overscroll-behavior:none;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1.5px, transparent 1.5px), linear-gradient(90deg, var(--grid) 1.5px, transparent 1.5px);
  background-size:26px 26px;
  -webkit-user-select:none; user-select:none;
}
body::before{ content:''; position:fixed; top:0; bottom:0; left:max(14px, calc(50% - 300px)); width:3px; background:var(--margin); z-index:0; }
button{ font:inherit; border:0; cursor:pointer; touch-action:manipulation; color:inherit; background:none; padding:0; }
button:focus-visible{ outline:4px solid var(--blue); outline-offset:3px; }
[hidden]{ display:none !important; }

.app{ position:relative; z-index:1; height:100%; max-width:540px; margin:0 auto; padding:12px 16px 14px; display:flex; flex-direction:column; }

.btn{
  background:var(--orange); color:#fff; font-weight:800; font-size:1.4rem; line-height:1; padding:14px 30px 12px; border-radius:999px;
  border:3px solid var(--ink); box-shadow:0 6px 0 var(--ink); text-shadow:0 2px 0 rgba(0,0,0,.18);
}
.btn:active{ transform:translateY(4px); box-shadow:0 2px 0 var(--ink); }
.btn.ghost{ background:var(--card); color:var(--ink); text-shadow:none; }
.round{ width:44px; height:44px; border-radius:50%; background:var(--card); border:3px solid var(--ink); font-size:1.15rem; box-shadow:0 3px 0 var(--ink); flex:none; display:grid; place-items:center; }
.round:active{ transform:translateY(2px); box-shadow:0 1px 0 var(--ink); }

/* menu */
.menu{ flex:1; display:flex; flex-direction:column; gap:14px; overflow-y:auto; padding:4px 2px 8px; }
.menu-head{ display:flex; align-items:center; justify-content:center; gap:10px; }
.mascot{ width:100px; height:100px; flex:none; animation:bob 2.6s ease-in-out infinite; }
@keyframes bob{ 50%{ transform:translateY(-6px) rotate(-3deg); } }
.logo{
  margin:0; font-weight:800; font-size:2.7rem; line-height:.9; color:var(--yellow); letter-spacing:-.01em;
  -webkit-text-stroke:3px var(--ink); paint-order:stroke fill; text-shadow:0 5px 0 var(--ink); transform:rotate(-3deg);
}
.menu-sub{ margin:0; text-align:center; font-weight:600; font-size:1.05rem; line-height:1.35; color:var(--soft); }
.cards{ display:flex; flex-direction:column; gap:16px; }
.gcard{
  display:grid; grid-template-columns:86px 1fr; gap:14px; align-items:center; text-align:left;
  background:var(--card); border:3px solid var(--ink); border-radius:22px; padding:10px 14px 10px 10px;
  box-shadow:0 6px 0 var(--ink);
}
.gcard:active{ transform:translateY(4px); box-shadow:0 2px 0 var(--ink); }
.tile{
  width:86px; height:86px; border-radius:18px; background:var(--c); border:3px solid var(--ink);
  display:grid; place-items:center; color:#fff; font-weight:800; font-size:2.4rem; line-height:1;
  -webkit-text-stroke:2px var(--ink); paint-order:stroke fill; text-shadow:0 3px 0 var(--ink);
}
.tile.small{ font-size:1.7rem; }
.tile.emo{ -webkit-text-stroke:0; text-shadow:none; font-size:2.7rem; }
.gcard h3{ margin:0; font-size:1.35rem; font-weight:800; line-height:1.05; }
.gcard p{ margin:2px 0 6px; font-size:.98rem; font-weight:500; color:var(--soft); line-height:1.25; }
.chips{ display:flex; gap:6px; flex-wrap:wrap; }
.chip{ font-size:.82rem; font-weight:700; background:var(--tc); padding:2px 10px; border-radius:99px; }
.rec{ font-size:.82rem; font-weight:700; color:var(--soft); margin-top:4px; }
.menu-foot{ display:flex; justify-content:center; gap:10px; flex-wrap:wrap; }
.pill{ background:var(--card); border:3px solid var(--ink); border-radius:99px; padding:4px 16px; font-weight:700; box-shadow:0 3px 0 var(--ink); }

/* jogo */
.game{ flex:1; display:flex; flex-direction:column; gap:8px; min-height:0; }
.hud{ display:flex; align-items:center; gap:10px; }
.score-wrap{ flex:1; display:flex; align-items:center; gap:8px; }
.score{ font-weight:800; font-size:2rem; line-height:1; min-width:2ch; }
.score.bump{ animation:bump .25s; }
@keyframes bump{ 50%{ transform:scale(1.25); } }
.combo{ font-weight:800; font-size:1rem; background:var(--yellow); color:#1f2a4d; border:3px solid var(--ink); border-radius:99px; padding:0 10px; opacity:0; transform:scale(.6); transition:.2s; }
.combo.on{ opacity:1; transform:scale(1); }
.hearts{ display:flex; gap:2px; font-size:1.35rem; }
.hearts span.lost{ filter:grayscale(1); opacity:.3; }
.hearts.hurt{ animation:shake .35s; }
@keyframes shake{ 20%,60%{ transform:translateX(-5px); } 40%,80%{ transform:translateX(5px); } }
.time{ height:16px; background:var(--card); border:3px solid var(--ink); border-radius:99px; overflow:hidden; }
#timefill{ height:100%; width:100%; background:var(--c, var(--green)); transform-origin:left; }
.time.low #timefill{ background:var(--red); animation:blink .5s infinite alternate; }
@keyframes blink{ to{ opacity:.55; } }
.stage{
  position:relative; flex:1; min-height:0; overflow:hidden; touch-action:none;
  background:var(--card); border:3px solid var(--ink); border-radius:24px; box-shadow:0 6px 0 var(--ink);
}
.stage.hurt{ animation:hurt .4s; }
@keyframes hurt{ 0%,100%{ box-shadow:0 6px 0 var(--ink); } 30%{ box-shadow:0 6px 0 var(--ink), inset 0 0 0 8px var(--red); } }
.cv{ position:absolute; left:0; top:0; width:100%; height:100%; display:block; }
.float{ position:absolute; z-index:6; pointer-events:none; font-weight:800; font-size:1.6rem; color:var(--green-d); -webkit-text-stroke:2px var(--card); paint-order:stroke fill; transform:translate(-50%,-50%); animation:floatUp .9s ease-out forwards; white-space:nowrap; }
.float.bad{ color:var(--red); }
.float.combo{ color:var(--orange-d); font-size:1.3rem; }
@keyframes floatUp{ to{ transform:translate(-50%,-160%) scale(1.1); opacity:0; } }
.count{ position:absolute; inset:0; z-index:20; display:grid; place-items:center; background:color-mix(in srgb, var(--card) 70%, transparent); }
.count span{ font-weight:800; font-size:6rem; color:var(--yellow); -webkit-text-stroke:4px var(--ink); paint-order:stroke fill; text-shadow:0 6px 0 var(--ink); animation:pop .5s cubic-bezier(.3,1.6,.6,1); }
@keyframes pop{ from{ transform:scale(.2); opacity:0; } }
.banner{ position:absolute; left:50%; top:45%; z-index:21; transform:translate(-50%,-50%); background:var(--yellow); color:#1f2a4d; border:3px solid var(--ink); box-shadow:0 6px 0 var(--ink); border-radius:20px; padding:10px 22px; font-weight:800; font-size:1.6rem; white-space:nowrap; animation:pop .4s cubic-bezier(.3,1.6,.6,1); }

/* Foguete das Contas */
.fg-q{ position:absolute; left:10px; right:10px; top:10px; z-index:5; text-align:center; pointer-events:none; }
.fg-q b{ display:inline-block; background:var(--pink); color:#fff; border:3px solid var(--ink); border-radius:16px; padding:2px 18px; font-size:clamp(1.5rem, 6.5vw, 2rem); font-weight:800; box-shadow:0 4px 0 var(--ink); text-shadow:0 2px 0 rgba(0,0,0,.2); }
.fg-q small{ display:block; width:max-content; max-width:94%; margin:8px auto 0; background:var(--card); border:2px solid var(--ink); border-radius:12px; padding:1px 10px; font-weight:700; font-size:.98rem; }
.fg-q small:empty{ display:none; }
.fg-dots{ display:block; width:max-content; max-width:94%; margin:6px auto 0; font-size:1.3rem; line-height:1.2; }
.fg-dots:empty{ display:none; }
.fg-q small.good{ color:var(--green-d); } .fg-q small.bad{ color:var(--red); }
.fg-hint{ position:absolute; left:8px; right:8px; bottom:6px; z-index:4; text-align:center; font-weight:700; font-size:.85rem; line-height:1.2; color:var(--soft); pointer-events:none; transition:opacity .4s; }
.fg-hint.off{ opacity:0; }

/* Pares Iguais */
.mm{ position:absolute; inset:0; display:flex; flex-direction:column; gap:8px; padding:10px; }
.mm-top{ text-align:center; font-weight:700; color:var(--soft); min-height:1.4em; }
.mm-grid{ flex:1; min-height:0; display:grid; gap:8px; grid-template-columns:repeat(var(--cols), 1fr); grid-auto-rows:1fr; }
.mc{ position:relative; perspective:700px; min-height:0; }
.mc-in{ position:absolute; inset:0; transition:transform .32s; transform-style:preserve-3d; }
.mc.up .mc-in{ transform:rotateY(180deg); }
.mc-f, .mc-b{ position:absolute; inset:0; -webkit-backface-visibility:hidden; backface-visibility:hidden; border:3px solid var(--ink); border-radius:14px; box-shadow:0 4px 0 var(--ink); display:grid; place-items:center; text-align:center; }
.mc-b{ background-color:var(--orange); background-image:radial-gradient(rgba(255,255,255,.28) 2px, transparent 2.5px); background-size:12px 12px; color:#fff; font-size:1.7rem; font-weight:800; -webkit-text-stroke:2px var(--ink); paint-order:stroke fill; }
.mc-f{ transform:rotateY(180deg); background:var(--t-blue); font-weight:800; font-size:clamp(1rem, 5.2vw, 1.6rem); line-height:1.05; padding:4px; }
.mc-f.val{ background:var(--t-yellow); }
.mc-f.sm{ font-size:clamp(.78rem, 3.6vw, 1.15rem); }
.mc-f.emo{ white-space:pre-line; font-size:clamp(.95rem, 4.4vw, 1.35rem); line-height:1.15; }
.mc.done .mc-f{ background:var(--green); color:#fff; }
.mc.done{ animation:pop .35s; }
.mc.no .mc-f{ background:var(--red); color:#fff; }
.mc.no{ animation:shake .35s; }

/* nível */
.lv{ display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin:0 0 6px; }
.lv button{ background:var(--paper); border:3px solid var(--ink); border-radius:14px; padding:6px 4px 4px; font-weight:800; font-size:1.05rem; box-shadow:0 4px 0 var(--ink); line-height:1.1; }
.lv button small{ display:block; font-size:.75rem; font-weight:600; color:var(--soft); }
.lv button[aria-pressed="true"]{ background:var(--c); color:#fff; }
.lv button[aria-pressed="true"] small{ color:#fff; }
.lv-info{ font-weight:600; font-size:.95rem; color:var(--soft); min-height:2.6em; margin:0 0 12px; line-height:1.3; }
.ht-label{ font-weight:800; text-align:left; margin:0 0 6px; }
.lvl-tag{ font-weight:800; font-size:.85rem; background:var(--card); border:3px solid var(--ink); border-radius:99px; padding:0 10px; }
.hearts.off{ visibility:hidden; }

/* Equação Relâmpago */
.rq{ position:absolute; inset:0; display:flex; flex-direction:column; gap:10px; padding:12px; }
.rq-card{ flex:1; min-height:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; background:var(--t-blue); border:3px solid var(--ink); border-radius:18px; padding:10px; text-align:center; }
.rq-topic{ font-weight:700; font-size:.95rem; background:var(--card); border:2px solid var(--ink); border-radius:99px; padding:0 12px; }
.rq-prompt{ font-weight:800; font-size:clamp(1.7rem, min(7.5vw, 6vh), 3rem); line-height:1.1; }
.rq-prompt.story{ font-size:clamp(1.2rem, 5.2vw, 1.6rem); font-weight:700; line-height:1.3; }
.rq-emo{ display:grid; grid-template-columns:repeat(5, auto); gap:2px 8px; font-size:clamp(1.4rem, min(6.5vw, 4.5vh), 2.1rem); line-height:1.2; }
.rq-ask{ font-weight:600; color:var(--soft); font-size:1.05rem; }
.rq-bolt{ display:flex; align-items:center; gap:6px; }
.rq-bolt span{ font-size:1.3rem; }
.rq-bar{ flex:1; height:12px; border:2px solid var(--ink); border-radius:99px; overflow:hidden; background:var(--card); }
#rq-fill{ height:100%; background:var(--yellow); transform-origin:left; }
.rq-opts{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.opt{
  position:relative; min-height:64px; background:var(--card); border:3px solid var(--ink); border-radius:16px; box-shadow:0 5px 0 var(--ink);
  font-weight:800; font-size:clamp(1.4rem, 6vw, 1.9rem); line-height:1.1; padding:8px 8px 6px 26px;
}
.opt:active{ transform:translateY(3px); box-shadow:0 2px 0 var(--ink); }
.opt i{ position:absolute; left:8px; top:6px; font-style:normal; font-size:.75rem; color:var(--soft); }
.opt.long{ font-size:clamp(.88rem, 3.7vw, 1.15rem); padding:8px 6px 6px 20px; }
.opt.right{ background:var(--green); color:#fff; }
.opt.wrong{ background:var(--red); color:#fff; animation:shake .35s; }
.opt.dim{ opacity:.45; }
.rq-fb{ min-height:2.6em; font-weight:700; font-size:1rem; line-height:1.3; text-align:center; }
.rq-fb.good{ color:var(--green-d); } .rq-fb.bad{ color:var(--red); }
:root[data-theme="dark"] .rq-fb.good{ color:var(--green); }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .rq-fb.good{ color:var(--green); } }

/* Reta Certeira */
.rc{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; gap:8px; padding:14px 12px 16px; }
.rc-target{ display:flex; align-items:center; gap:10px; background:var(--t-green); border:3px solid var(--ink); border-radius:18px; padding:6px 20px; }
.rc-target span{ font-weight:700; color:var(--soft); font-size:1.1rem; }
.rc-target b{ font-weight:800; font-size:2.6rem; line-height:1.1; }
.rc-line{ position:relative; width:100%; flex:1; min-height:120px; }
.rc-fb{ min-height:3.4em; text-align:center; line-height:1.3; }
.rc-fb b{ display:block; font-size:1.35rem; font-weight:800; }
.rc-fb span{ font-weight:600; font-size:1rem; color:var(--soft); }
.rc-stop{ background:var(--green); font-size:1.6rem; padding:16px 44px 14px; }

/* fim */
.end{ flex:1; display:flex; flex-direction:column; gap:12px; overflow-y:auto; padding:2px 2px 10px; }
.end-head{ text-align:center; font-weight:800; font-size:2rem; line-height:1; color:var(--yellow); -webkit-text-stroke:3px var(--ink); paint-order:stroke fill; text-shadow:0 4px 0 var(--ink); margin-top:6px; }
.card{ background:var(--card); border:3px solid var(--ink); border-radius:22px; box-shadow:0 6px 0 var(--ink); padding:14px 16px; }
.result{ text-align:center; }
.end-game{ font-weight:700; color:var(--soft); }
.medal{ font-size:3.4rem; line-height:1.1; animation:pop .6s cubic-bezier(.3,1.6,.6,1) .1s backwards; }
.big{ font-weight:800; font-size:3.4rem; line-height:1; }
.rank{ font-weight:800; font-size:1.25rem; }
.stats{ display:flex; justify-content:center; gap:8px; flex-wrap:wrap; margin-top:8px; }
.stats span{ background:var(--paper); border:2px solid var(--ink); border-radius:99px; padding:1px 12px; font-weight:700; font-size:.92rem; }
.record{ margin-top:8px; font-weight:700; color:var(--soft); }
.record.new{ color:var(--orange-d); }
.fact b{ display:block; font-size:1.05rem; margin-bottom:2px; }
.fact span{ font-weight:500; line-height:1.4; }
.end-actions{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:4px; }

/* como jogar */
.overlay{ position:fixed; inset:0; z-index:30; background:rgba(20,28,54,.5); display:grid; place-items:center; padding:16px; animation:fade .2s; }
@keyframes fade{ from{ opacity:0; } }
.ht-card{ width:min(100%, 400px); max-height:100%; overflow:auto; background:var(--card); border:3px solid var(--ink); border-radius:26px; padding:16px 18px 14px; text-align:center; box-shadow:0 8px 0 var(--ink); animation:rise .3s cubic-bezier(.3,1.4,.6,1); }
@keyframes rise{ from{ transform:translateY(30px) scale(.94); opacity:0; } }
.ht-card .tile{ margin:0 auto 6px; animation:bob 2s ease-in-out infinite; }
.ht-card h2{ margin:0; font-size:1.7rem; font-weight:800; line-height:1.1; }
.ht-concept{ font-weight:600; color:var(--soft); margin:2px 0 10px; }
.ht-steps{ list-style:none; margin:0 0 14px; padding:0; display:flex; flex-direction:column; gap:8px; text-align:left; counter-reset:s; }
.ht-steps li{ counter-increment:s; display:grid; grid-template-columns:30px 1fr; gap:10px; align-items:start; font-weight:600; line-height:1.3; }
.ht-steps li::before{ content:counter(s); width:30px; height:30px; border-radius:50%; background:var(--tc); border:2px solid var(--ink); display:grid; place-items:center; font-weight:800; }
.ht-back{ display:block; margin:12px auto 0; font-weight:700; color:var(--soft); text-decoration:underline; }

#confetti{ position:fixed; inset:0; z-index:40; pointer-events:none; width:100%; height:100%; }

@media (min-height:760px){ .gcard{ padding:14px 16px 14px 12px; } }
@media (max-height:640px){ .mascot{ width:72px; height:72px; } .logo{ font-size:2.2rem; } .tile{ width:72px; height:72px; font-size:2rem; } .gcard{ grid-template-columns:72px 1fr; } .opt{ min-height:54px; } }
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{ animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; } }
</style>
</head>
<body>

<div class="app">
  <section class="menu" id="scr-menu">
    <header class="menu-head">
      <svg class="mascot" viewBox="0 0 120 120" aria-hidden="true"><use href="#xis"/></svg>
      <h1 class="logo">Fliperama<br>do X</h1>
    </header>
    <p class="menu-sub">Quatro jogos de 3 minutos para aprender a contar, somar e tirar brincando. Escolha um jogo, escolha o nível e divirta-se!</p>
    <div class="cards" id="cards"></div>
    <div class="menu-foot"><button type="button" class="pill" id="mute-menu">🔊 Som ligado</button></div>
  </section>

  <section class="game" id="scr-game" hidden>
    <div class="hud">
      <button type="button" class="round" id="btn-home" aria-label="Voltar ao menu">🏠</button>
      <div class="score-wrap"><div class="score" id="score">0</div><div class="combo" id="combo">x2</div></div>
      <div class="lvl-tag" id="lvl-tag">Médio</div>
      <div class="hearts" id="hearts" aria-label="Vidas"></div>
      <button type="button" class="round" id="mute" aria-label="Ligar ou desligar som">🔊</button>
    </div>
    <div class="time" id="time"><div id="timefill"></div></div>
    <div class="stage" id="stage"></div>
  </section>

  <section class="end" id="scr-end" hidden>
    <div class="end-head" id="end-head">Tempo esgotado!</div>
    <div class="card result">
      <div class="end-game" id="end-game"></div>
      <div class="medal" id="medal">🏆</div>
      <div class="big" id="final">0</div>
      <div class="rank" id="rank"></div>
      <div class="stats" id="stats"></div>
      <div class="record" id="record"></div>
    </div>
    <div class="card fact"><b id="learn-title">Você praticou</b><span id="learn"></span></div>
    <div class="end-actions">
      <button type="button" class="btn" id="btn-again">Jogar de novo</button>
      <button type="button" class="btn ghost" id="btn-menu">Outros jogos</button>
    </div>
    <button type="button" class="ht-back" id="btn-level">Trocar o nível</button>
  </section>
</div>

<div class="overlay" id="howto" hidden>
  <div class="ht-card" id="ht-card" role="dialog" aria-modal="true" aria-labelledby="ht-title">
    <div class="tile" id="ht-tile"></div>
    <h2 id="ht-title"></h2>
    <div class="ht-concept" id="ht-concept"></div>

<script>
(function(){
'use strict';
var $ = function(id){ return document.getElementById(id); };
var DUR = 180000, LIVES = 3;

/* ---------- utilidades ---------- */
function rnd(a, b){ return a + Math.floor(Math.random() * (b - a + 1)); }
function pick(a){ return a[Math.floor(Math.random() * a.length)]; }
function shuffle(a){ a = a.slice(); for(var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function wait(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
function css(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
function store(k, v){ try{ if(v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); }catch(e){ return null; } }
function esc(s){ return String(s).replace(/[&<>]/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;' }[c]; }); }
function relPos(el, e){ var r = el.getBoundingClientRect(); return { x:e.clientX - r.left, y:e.clientY - r.top }; }
function centerIn(stage, el){ var a = stage.getBoundingClientRect(), b = el.getBoundingClientRect(); return { x:b.left - a.left + b.width / 2, y:b.top - a.top + b.height / 2 }; }

function makeCanvas(host){
  var cv = document.createElement('canvas'); cv.className = 'cv'; host.appendChild(cv);
  var o = { cv:cv, ctx:cv.getContext('2d'), W:0, H:0 };
  function fit(){
    var r = host.getBoundingClientRect(), d = Math.min(2, window.devicePixelRatio || 1);
    o.W = r.width; o.H = r.height;
    cv.width = Math.max(1, Math.round(r.width * d)); cv.height = Math.max(1, Math.round(r.height * d));
    o.ctx.setTransform(d, 0, 0, d, 0, 0);
  }
  fit();
  o.ro = new ResizeObserver(fit); o.ro.observe(host);
  return o;
}

/* ---------- som ---------- */
var ac = null, muted = store('fx-mute') === '1';
function tone(f, d, type, vol, delay, slide){
  if(muted) return;
  try{
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if(ac.state === 'suspended') ac.resume();
    var t = ac.currentTime + (delay || 0), o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
    if(slide) o.frequency.exponentialRampToValueAtTime(slide, t + d);
    g.gain.setValueAtTime(vol || 0.08, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d + 0.03);
  }catch(e){}
}
var sfx = {
  click:function(){ tone(660, .06, 'triangle', .06); },
  slice:function(){ tone(1500, .08, 'sawtooth', .025, 0, 400); tone(700, .12, 'triangle', .07, 0, 1700); },
  good:function(){ tone(880, .1, 'triangle', .08); tone(1320, .12, 'triangle', .07, .07); },
  bad:function(){ tone(320, .35, 'sawtooth', .06, 0, 90); },
  power:function(){ [523, 784, 1047, 1568].forEach(function(f, i){ tone(f, .1, 'square', .04, i * .05); }); },
  whoosh:function(){ tone(260, .16, 'sine', .025, 0, 700); },
  tick:function(){ tone(1000, .05, 'square', .03); },
  beep:function(){ tone(520, .12, 'triangle', .08); },
  go:function(){ tone(660, .15, 'triangle', .1); tone(990, .25, 'triangle', .1, .12); },
  win:function(){ [523, 659, 784, 1047, 1319].forEach(function(f, i){ tone(f, .2, 'triangle', .08, i * .11); }); }
};
function vibrate(p){ try{ navigator.vibrate && navigator.vibrate(p); }catch(e){} }
function setMuted(m){
  muted = m; store('fx-mute', m ? '1' : '0');
  $('mute').textContent = m ? '🔇' : '🔊';
  $('mute-menu').textContent = m ? '🔇 Som desligado' : '🔊 Som ligado';
}

/* ---------- ajudantes de questões ---------- */
var FRUITS = ['🍎', '🍓', '🍌', '🐟', '⭐', '🎈', '🐞', '🌸', '🚗', '🐶'];
function options(answer, cands, fill, count){
  count = count || 3;
  var out = [], seen = {}; seen[answer] = 1;
  cands.forEach(function(c){ if(out.length < count && !seen[c]){ seen[c] = 1; out.push(c); } });
  var guard = 0;
  while(out.length < count && guard++ < 80){ var c = fill(); if(!seen[c]){ seen[c] = 1; out.push(c); } }
  return out;
}
// Wrong answers close to the right one are what actually test counting; negatives make no sense at this age.
function neighbors(n){ return shuffle([n + 1, n - 1, n + 2, n - 2].filter(function(v){ return v >= 0; })).map(String); }
function nearFill(n, spread){ return function(){ return String(Math.max(0, n + rnd(-spread, spread))); }; }
function range(a, b){ var out = []; for(var i = a; i <= b; i++) out.push(i); return out; }
function countFrom(start, steps, dir){ return range(1, steps).map(function(i){ return start + i * dir; }).join(', '); }
// Two-digit sums and differences stay with "easy" second terms: units or whole tens.
function bigSum(max){ var a = rnd(10, max - 10), b = Math.random() < .5 ? rnd(1, 9) : rnd(1, Math.floor((max - a) / 10)) * 10; return [a, b]; }
function bigSub(max){ var a = rnd(20, max), b = Math.random() < .5 ? rnd(1, 9) : rnd(1, Math.floor(a / 10)) * 10; return [a, b]; }
function sumExpl(a, b){
  if(b <= 4) return 'Comece no ' + a + ' e conte mais ' + b + ': ' + countFrom(a, b, 1);
  if(b % 10 === 0 && a >= 10) return 'Some as dezenas: ' + a + ' + ' + b + ' = ' + (a + b);
  return a + ' + ' + b + ' = ' + (a + b);
}
function subExpl(a, b){
  if(b <= 4) return 'Comece no ' + a + ' e volte ' + b + ': ' + countFrom(a, b, -1);
  if(b % 10 === 0 && a >= 10) return 'Tire as dezenas: ' + a + ' − ' + b + ' = ' + (a - b);
  return 'Tirando ' + b + ' de ' + a + ', sobram ' + (a - b);
}

/* =========================================================
   JOGO 1: FOGUETE DAS CONTAS
   ========================================================= */
function sumQ(a, b){ return { q:a + ' + ' + b, a:String(a + b), c:neighbors(a + b).concat([String(Math.abs(a - b))]) }; }
function subQ(a, b){ return { q:a + ' − ' + b, a:String(a - b), c:neighbors(a - b).concat([String(a + b)]) }; }
// Subtraction shows what is left plus a cross for each one taken away, so the figure matches "tirar".
function withDots(q, a, b, op){ var e = pick(FRUITS); q.dots = op === '+' ? e.repeat(a) + ' + ' + e.repeat(b) : e.repeat(a - b) + ' ' + '❌'.repeat(b); return q; }
var FG = [
  [ // fácil: até 10, com figuras para contar
    function(){ var a = rnd(1, 9), b = rnd(1, 10 - a); return withDots(sumQ(a, b), a, b, '+'); },
    function(){ var a = rnd(1, 5), b = rnd(1, 5); return withDots(sumQ(a, b), a, b, '+'); },
    function(){ var a = rnd(2, 10), b = rnd(1, a); return withDots(subQ(a, b), a, b, '−'); }
  ],
  [ // médio: até 20 e dobro
    function(){ var a = rnd(3, 15), b = rnd(1, 20 - a); return sumQ(a, b); },
    function(){ var a = rnd(8, 20), b = rnd(1, Math.min(10, a)); return subQ(a, b); },
    function(){ var n = rnd(2, 10); return { q:'dobro de ' + n, a:String(2 * n), c:neighbors(2 * n).concat([String(n), String(n + 2)]) }; }
  ],
  [ // difícil: dezenas até 50 e tabuada do 2, 5 e 10
    function(){ var ab = bigSum(50); return sumQ(ab[0], ab[1]); },
    function(){ var ab = bigSub(50); return subQ(ab[0], ab[1]); },
    function(){ var k = pick([2, 5, 10]), n = rnd(2, 10); return { q:n + ' × ' + k, a:String(n * k), c:[String(k * (n + 1)), String(k * (n - 1)), String(n + k)].concat(neighbors(n * k)) }; }
  ]
];

function Foguete(api, stage, L){
  var C = makeCanvas(stage), ctx = C.ctx, lanes = L === 2 ? 4 : 3;
  stage.insertAdjacentHTML('beforeend', '<div class="fg-q"><b id="fg-q">Prepare-se</b><span class="fg-dots" id="fg-dots"></span><small id="fg-fb"></small></div><div class="fg-hint">Toque na pista com a resposta certa. Toque de novo para ir mais rápido!</div>');
  var qEl = $('fg-q'), dotsEl = $('fg-dots'), fbEl = $('fg-fb');
  var col = { ink:css('--ink'), card:css('--card'), g:css('--green'), r:css('--red'), y:css('--yellow'), o:css('--orange'), p:css('--pink'), soft:css('--soft'), grid:css('--grid'), font:css('--font') };
  var lane = Math.floor(lanes / 2), rx = null, row = null, raf = 0, nextT = 0, fbT = 0, alive = true, last = performance.now(), wig = 0;
  var stars = []; for(var i = 0; i < 40; i++) stars.push({ x:Math.random(), y:Math.random(), s:1 + Math.random() * 2.5 });
  var parts = [], lastFn = null, hintN = 0;
  var BASE = [20, 15, 11][L], DROP = [2, 2, 2][L];

  function laneX(i){ return (i + .5) * C.W / lanes; }
  function rocketY(){ return C.H - 86; }
  function next(){
    if(!api.running) return;
    var f; do { f = pick(FG[L]); } while(f === lastFn); lastFn = f;
    var q = f(), wrong = options(q.a, q.c, nearFill(Number(q.a), 5), lanes - 1);
    var vals = shuffle([q.a].concat(wrong));
    qEl.textContent = q.q + ' = ?';
    dotsEl.textContent = q.dots || '';
    // Answers start just below the question so the counting figures never hide behind them.
    var anchor = q.dots ? dotsEl : qEl, y0 = 10 + anchor.offsetTop + anchor.offsetHeight + 32;
    row = { vals:vals, ok:vals.indexOf(q.a), y:y0, y0:y0, travel:BASE - DROP * api.progress(), done:false, res:-1, a:q.a, q:q.q, t0:performance.now(), boost:false, frac:0 };
  }
  function setLane(i){ if(!api.running) return; i = Math.max(0, Math.min(lanes - 1, i)); if(i === lane) confirm(); else { lane = i; sfx.click(); } }
  function confirm(){ if(!api.running || !row || row.done || row.boost) return; row.boost = true; row.frac = Math.max(0, 1 - (performance.now() - row.t0) / (row.travel * 1000)); sfx.whoosh(); }
  function resolve(){
    row.done = true; row.res = lane; if(++hintN >= 3) stage.querySelector('.fg-hint').classList.add('off');
    var x = laneX(lane), y = rocketY() - 40;
    for(var i = 0; i < 14; i++){ var a = Math.random() * Math.PI * 2, s = 80 + Math.random() * 200; parts.push({ x:x, y:row.y, vx:Math.cos(a) * s, vy:Math.sin(a) * s, life:.55, c:lane === row.ok ? col.g : col.r }); }
    if(lane === row.ok){ api.good(10 + Math.round(10 * row.frac), x, y); fb('✔ ' + row.q + ' = ' + row.a, 'good'); }
    else { api.bad(x, y); wig = .5; fb('A resposta era ' + row.a, 'bad'); }
    nextT = setTimeout(next, lane === row.ok ? 450 : 1100);
  }
  function fb(t, cls){ fbEl.textContent = t; fbEl.className = cls; clearTimeout(fbT); fbT = setTimeout(function(){ fbEl.textContent = ''; }, 1300); }

  function rr(x, y, w, h, r){ ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
  function rocket(x, y, t){
    ctx.save(); ctx.translate(x + Math.sin(t * 40) * wig * 8, y); ctx.lineWidth = 3; ctx.strokeStyle = col.ink; ctx.lineJoin = 'round';
    var fl = 14 + Math.sin(t * 30) * 5;
    ctx.fillStyle = col.o; ctx.beginPath(); ctx.moveTo(-9, 22); ctx.lineTo(0, 22 + fl + 8); ctx.lineTo(9, 22); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = col.y; ctx.beginPath(); ctx.moveTo(-5, 22); ctx.lineTo(0, 22 + fl); ctx.lineTo(5, 22); ctx.closePath(); ctx.fill();
    ctx.fillStyle = col.p; ctx.beginPath(); ctx.moveTo(-16, 8); ctx.lineTo(-26, 26); ctx.lineTo(-12, 22); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(16, 8); ctx.lineTo(26, 26); ctx.lineTo(12, 22); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.moveTo(0, -34); ctx.bezierCurveTo(18, -20, 16, 10, 13, 24); ctx.lineTo(-13, 24); ctx.bezierCurveTo(-16, 10, -18, -20, 0, -34); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = col.p; ctx.beginPath(); ctx.moveTo(0, -34); ctx.bezierCurveTo(9, -27, 12, -20, 13, -16); ctx.lineTo(-13, -16); ctx.bezierCurveTo(-12, -20, -9, -27, 0, -34); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#3d8bff'; ctx.beginPath(); ctx.arc(0, -2, 7, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.restore();
  }
  function frame(now){
    if(!alive) return;
    var dt = Math.min(.05, (now - last) / 1000); last = now; var W = C.W, H = C.H, t = now / 1000;
    if(rx === null) rx = laneX(lane);
    rx += (laneX(lane) - rx) * Math.min(1, dt * 16); wig = Math.max(0, wig - dt);
    var ry = rocketY();
    if(row && !row.done && api.running){
      row.y += (ry - 40 - row.y0) / row.travel * dt * (row.boost ? 10 : 1);
      if(row.y >= ry - 40) resolve();
    }
    parts = parts.filter(function(p){ p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; return p.life > 0; });
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = col.soft; ctx.globalAlpha = .35;
    stars.forEach(function(s){ s.y += dt * (.12 + s.s * .06); if(s.y > 1) s.y -= 1; ctx.fillRect(s.x * W, s.y * H, s.s, s.s * 3); });
    ctx.globalAlpha = 1;
    ctx.strokeStyle = col.grid; ctx.lineWidth = 3; ctx.setLineDash([12, 12]); ctx.lineDashOffset = -t * 60;
    for(var i = 1; i < lanes; i++){ ctx.beginPath(); ctx.moveTo(i * W / lanes, 0); ctx.lineTo(i * W / lanes, H); ctx.stroke(); }
    ctx.setLineDash([]);
    if(row){
      var gw = W / lanes - 14, gh = 52;
      row.vals.forEach(function(v, i){
        if(row.done && i !== row.res && i !== row.ok) ctx.globalAlpha = .35;
        var x = laneX(i) - gw / 2, y = row.y - gh / 2;
        rr(x, y, gw, gh, 14);
        ctx.fillStyle = row.done ? (i === row.ok ? col.g : (i === row.res ? col.r : col.card)) : col.card; ctx.fill();
        ctx.lineWidth = 3; ctx.strokeStyle = col.ink; ctx.stroke();
        var fs = Math.min(24, gw / Math.max(3, v.length) * 1.7);
        ctx.font = '800 ' + fs + 'px ' + col.font; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillStyle = row.done && (i === row.ok || i === row.res) ? '#ffffff' : col.ink; ctx.fillText(v, laneX(i), row.y + 2);
        ctx.globalAlpha = 1;
      });
    }
    parts.forEach(function(p){ ctx.globalAlpha = Math.max(0, p.life * 2); ctx.fillStyle = p.c; ctx.fillRect(p.x - 4, p.y - 4, 8, 8); });
    ctx.globalAlpha = 1;
    rocket(rx, ry, t);
    raf = requestAnimationFrame(frame);
  }
  var sx = null;
  function onDown(e){ if(!api.running) return; var p = relPos(stage, e); sx = p.x; setLane(Math.floor(p.x / (C.W / lanes))); }
  function onKey(e){
    if(e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A'){ e.preventDefault(); setLane(lane - 1); }
    else if(e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D'){ e.preventDefault(); setLane(lane + 1); }
    else if(e.code === 'Space' || e.key === 'Enter' || e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W'){ e.preventDefault(); confirm(); }
    else { var n = parseInt(e.key, 10); if(n >= 1 && n <= lanes) setLane(n - 1); }

  window.addEventListener('keydown', onKey);
  raf = requestAnimationFrame(frame);
  return {
    start:function(){ next(); },
    stop:function(){ clearTimeout(nextT); },
    destroy:function(){ alive = false; cancelAnimationFrame(raf); clearTimeout(nextT); clearTimeout(fbT); stage.removeEventListener('pointerdown', onDown); window.removeEventListener('keydown', onKey); C.ro.disconnect(); }
  };
}

/* =========================================================
   JOGO 2: EQUAÇÃO RELÂMPAGO
   ========================================================= */
var STORIES = [
  { add:true, t:'Você tem {a} {e} e ganha mais {b}.', ask:'Com quantos você fica?' },
  { add:true, t:'Tem {a} {e} no jardim. Chegam mais {b}.', ask:'Quantos tem agora?' },
  { add:false, t:'Você tem {a} {e} e dá {b} de presente.', ask:'Com quantos você fica?' },
  { add:false, t:'Tinha {a} {e} na mesa. {b} sumiram!', ask:'Quantos sobraram?' }
];
var STORY_E = ['🎈', '🍪', '🐸', '⭐', '🍓', '🐥', '🧸'];
function emojiFig(e, n){ var h = ''; for(var i = 0; i < n; i++) h += '<span>' + e + '</span>'; return '<div class="rq-emo">' + h + '</div>'; }
var GEN = [
  { min:0, f:function contar(L){
    var n = rnd([2, 5, 10][L], [10, 15, 20][L]), e = pick(FRUITS), ans = String(n), fives = Math.floor(n / 5), expl;
    if(n <= 5) expl = 'Contando de 1 em 1: ' + countFrom(0, n, 1);
    else expl = 'Cada linha tem 5: ' + countFrom(0, fives, 5) + (n % 5 ? ' e mais ' + n % 5 : '') + '. São ' + n;
    return { topic:'Contar', prompt:'', fig:emojiFig(e, n), ask:'Quantos ' + e + ' tem aqui?', answer:ans,
      wrong:options(ans, neighbors(n), nearFill(n, 3)), expl:expl };
  }},
  { min:0, f:function somar(L){
    var a, b;
    if(L === 0){ a = rnd(1, 9); b = rnd(1, 10 - a); }
    else if(L === 1){ a = rnd(3, 15); b = rnd(1, 20 - a); }
    else { var ab = bigSum(99); a = ab[0]; b = ab[1]; }
    var ans = String(a + b);
    return { topic:'Somar', prompt:a + ' + ' + b, ask:'Quanto dá?', answer:ans,
      wrong:options(ans, neighbors(a + b).concat([String(a + b + 10)]), nearFill(a + b, 4)), expl:sumExpl(a, b) };
  }},
  { min:0, f:function tirar(L){
    var a, b;
    if(L === 0){ a = rnd(2, 10); b = rnd(1, a); }
    else if(L === 1){ a = rnd(8, 20); b = rnd(1, Math.min(10, a)); }
    else { var ab = bigSub(99); a = ab[0]; b = ab[1]; }
    var ans = String(a - b);
    return { topic:'Tirar', prompt:a + ' − ' + b, ask:'Quanto sobra?', answer:ans,
      wrong:options(ans, neighbors(a - b).concat([String(a + b)]), nearFill(a - b, 4)), expl:subExpl(a, b) };
  }},
  { min:0, f:function maiorMenor(L){
    var nums, big = Math.random() < .5;
    if(L === 2){
      // Same two digits swapped (47 and 74) is the classic place-value trap.
      var d1 = rnd(1, 9), d2; do { d2 = rnd(1, 9); } while(d2 === d1);
      nums = [d1 * 10 + d2, d2 * 10 + d1, d1 * 11, d2 * 11];
    } else {
      nums = shuffle(range(0, L === 0 ? 20 : 50)).slice(0, 4);
    }
    var target = big ? Math.max.apply(null, nums) : Math.min.apply(null, nums), ans = String(target);
    var others = nums.filter(function(n){ return n !== target; }).map(String), expl;
    if(L === 2) expl = 'Olhe primeiro as dezenas: o ' + target + ' tem ' + Math.floor(target / 10) + (Math.floor(target / 10) === 1 ? ' dezena' : ' dezenas');
    else expl = 'Contando, o ' + target + (big ? ' vem depois de todos os outros' : ' vem antes de todos os outros');
    return { topic:big ? 'Maior' : 'Menor', prompt:big ? '🐘' : '🐭', ask:big ? 'Qual é o MAIOR número?' : 'Qual é o MENOR número?', answer:ans,
      wrong:options(ans, others, nearFill(target, 5)), expl:expl };
  }},
  { min:0, f:function sequencia(L){
    var step = L === 0 ? 1 : L === 1 ? pick([2, 5, 10]) : pick([2, 3, 5, 10]), down = L === 2 && Math.random() < .4;
    var start = down ? rnd(4, 10) * step : (L === 0 ? rnd(0, 15) : rnd(0, 5) * step);

// tick: distance between marks; label: which marks get a number; speed: [start, extra by the end]; tol: [na mosca, muito perto, perto].
var RETA = [
  { lo:0, hi:10, tick:1, label:1, speed:[1, .6], tol:[.25, .5, 1] },
  { lo:0, hi:20, tick:1, label:2, speed:[1.8, 1.2], tol:[.4, .8, 1.5] },
  { lo:0, hi:100, tick:5, label:10, speed:[10, 7], tol:[2.5, 5, 9] }

function genTarget(L){
  var r = Math.random(), n, a, b;
  if(L === 0){ n = rnd(1, 9); return numT(n, 'O ' + n + ' fica entre o ' + (n - 1) + ' e o ' + (n + 1)); }
  if(L === 1){
    if(r < .5){ n = rnd(1, 19); return numT(n, 'O ' + n + ' fica entre o ' + (n - 1) + ' e o ' + (n + 1)); }
    a = rnd(2, 12); b = rnd(1, 19 - a);
    return { text:a + ' + ' + b, v:a + b, expl:a + ' + ' + b + ' = ' + (a + b) };
  }
  if(r < .4){ n = rnd(1, 19) * 5; return numT(n, n % 10 ? 'O ' + n + ' fica bem no meio do ' + (n - 5) + ' e do ' + (n + 5) : 'O ' + n + ' tem ' + n / 10 + ' dezenas'); }
  if(r < .7){ n = rnd(2, 9); return { text:n + ' dezenas', v:n * 10, expl:n + ' dezenas = ' + n + ' × 10 = ' + n * 10 }; }

  return { text:a + ' + ' + b, v:a + b, expl:'Some as dezenas: ' + a + ' + ' + b + ' = ' + (a + b) };

// Emoji cards break into rows of 3 so a quantity can be read at a glance.
function emojiRows(e, n){ var rows = []; for(var i = 0; i < n; i += 3) rows.push(e.repeat(Math.min(3, n - i))); return rows.join('\n'); }
function exprFor(r, L){
  var kinds = r >= 2 ? ['+', '−'] : ['−'];
  if(L === 2){ if(r % 2 === 0) kinds.push('dobro'); if(r % 5 === 0 || r % 2 === 0) kinds.push('×'); }
  var kind = pick(kinds), a;
  if(kind === '+'){ a = rnd(1, r - 1); return a + ' + ' + (r - a); }
  if(kind === 'dobro') return 'dobro de ' + r / 2;
  if(kind === '×'){ var k = r % 5 === 0 ? 5 : 2; return r / k + ' × ' + k; }
  a = rnd(1, L === 1 ? 5 : 9); return (r + a) + ' − ' + a;
}
// Every pair gets a different result, so no card can match two others.
function pairsFor(L, n){
  if(L === 0) return shuffle(range(1, 9)).slice(0, n).map(function(k, i){ return [emojiRows(FRUITS[i], k), String(k), true]; });
  return shuffle(range(1, L === 1 ? 10 : 20)).slice(0, n).map(function(r){ return [exprFor(r, L), String(r)]; });
}
function Pares(api, stage, L){
  var NP = [6, 8, 10][L], COLS = L === 0 ? 3 : 4, PREV = [7000, 6000, 5000][L];
  stage.insertAdjacentHTML('beforeend', '<div class="mm"><div class="mm-top" id="mm-top">Memorize as cartas!</div><div class="mm-grid" id="mm-grid" style="--cols:' + COLS + '"></div></div>');
  var grid = $('mm-grid'), top = $('mm-top'), cards = [], first = null, lock = true, left = 0, round = 0, timers = [], alive = true;
  function later(fn, ms){ var id = setTimeout(fn, ms); timers.push(id); return id; }

  function deal(){
    round++;
    var list = [];
    pairsFor(L, NP).forEach(function(p, i){ list.push({ t:p[0], k:i, val:false, emo:!!p[2] }); list.push({ t:p[1], k:i, val:true }); });
    list = shuffle(list); cards = []; grid.innerHTML = ''; left = NP; first = null; lock = true;
    list.forEach(function(c){
      var b = document.createElement('button'); b.type = 'button'; b.className = 'mc up';
      b.innerHTML = '<div class="mc-in"><div class="mc-b">?</div><div class="mc-f' + (c.val ? ' val' : '') + (c.emo ? ' emo' : c.t.length > 6 ? ' sm' : '') + '">' + esc(c.t) + '</div></div>';
      b.setAttribute('aria-label', c.t);

    later(function(){

      lock = false;
    }, PREV);
  }
  function flip(c){
    if(lock || !api.running || c.done || c === first) return;
    c.el.classList.add('up'); sfx.click();
    if(!first){ first = c; return; }
    var a = first, b = c; first = null;
    if(a.k === b.k && a.val !== b.val){

      var p = centerIn(stage, b.el); api.good(10, p.x, p.y); left--;

        api.add(30, stage.clientWidth / 2, stage.clientHeight / 2, '+30 bônus'); sfx.power();

    }
  }
  return {
    start:function(){ deal(); },
    stop:function(){ lock = true; timers.forEach(clearTimeout); },
    destroy:function(){ alive = false; timers.forEach(clearTimeout); }

}

var api = {
  get running(){ return !!(run && run.running); },
  progress:function(){ return run && run.t0 ? Math.min(1, (performance.now() - run.t0) / DUR) : 0; },
  good:function(pts, x, y){
    if(!api.running) return;
    run.streak++; run.hits++; run.best = Math.max(run.best, run.streak);
    var mult = 1 + Math.min(3, Math.floor(run.streak / 4)), gain = pts * mult;
    run.score += gain; renderScore(); floatText('+' + gain, x, y, '');
    sfx.good();
    if(run.streak % 4 === 0 && mult > 1){ floatText('Combo x' + mult + '!', x, y - 34, 'combo'); sfx.power(); }
  },
  add:function(pts, x, y, label){ if(!api.running) return; run.score += pts; renderScore(); floatText(label || '+' + pts, x, y, 'combo'); },
  bad:function(x, y){
    if(!api.running) return;
    run.streak = 0; run.miss++; run.lives--; renderScore(); renderHearts(true);
    if(x != null) floatText('−❤', x, y, 'bad');
    var st = $('stage'); st.classList.remove('hurt'); void st.offsetWidth; st.classList.add('hurt');
    sfx.bad(); vibrate([40, 40, 40]);
    if(run.lives <= 0) finish('lives');
  },
  miss:function(){ if(!api.running) return; run.miss++; if(run.streak){ run.streak = 0; renderScore(); } }
};
function floatText(t, x, y, cls){
  var e = document.createElement('div'); e.className = 'float ' + cls; e.textContent = t;
  e.style.left = x + 'px'; e.style.top = y + 'px';
  $('stage').appendChild(e); setTimeout(function(){ e.remove(); }, 950);
}
function renderScore(){
  var s = $('score'); s.textContent = run.score; s.classList.remove('bump'); void s.offsetWidth; s.classList.add('bump');
  var mult = 1 + Math.min(3, Math.floor(run.streak / 4)), c = $('combo');
  c.textContent = 'x' + mult; c.classList.toggle('on', mult > 1);
}
function renderHearts(hurt){
  var h = ''; for(var i = 0; i < LIVES; i++) h += '<span class="' + (i < run.lives ? '' : 'lost') + '">❤️</span>';
  var el = $('hearts'); el.innerHTML = h; el.classList.toggle('off', !!cur.noLives);
  if(hurt){ el.classList.remove('hurt'); void el.offsetWidth; el.classList.add('hurt'); }
}
function show(id){ ['scr-menu', 'scr-game', 'scr-end'].forEach(function(s){ $(s).hidden = s !== id; }); }
function recKey(g, l){ return 'fx-rec-' + g.id + '-' + l; }

function renderMenu(){
  var box = $('cards'); box.innerHTML = '';
  GAMES.forEach(function(g){
    var b = document.createElement('button'); b.type = 'button'; b.className = 'gcard';
    b.style.setProperty('--c', g.c); b.style.setProperty('--tc', g.tc);
    var recs = [];
    for(var l = 0; l < 3; l++){ var r = parseInt(store(recKey(g, l)) || '0', 10); if(r) recs.push(LEVELS[l].toLowerCase() + ' ' + r); }
    b.innerHTML = '<div class="tile' + (g.small ? ' small' : '') + (g.emo ? ' emo' : '') + '">' + esc(g.glyph) + '</div>' +
      '<div><h3>' + esc(g.title) + '</h3><p>' + esc(g.desc) + '</p><div class="chips">' +
      g.chips.map(function(c){ return '<span class="chip">' + esc(c) + '</span>'; }).join('') + '</div>' +
      (recs.length ? '<div class="rec">🏆 Recorde: ' + recs.join(', ') + '</div>' : '') + '</div>';
    b.addEventListener('click', function(){ openHowto(g); });
    box.appendChild(b);
  });
}
function setLevel(l){
  level = l; store('fx-lvl', String(l));
  var bs = $('lv').querySelectorAll('button');
  for(var i = 0; i < bs.length; i++) bs[i].setAttribute('aria-pressed', String(i === l));
  if(cur) $('lv-info').textContent = cur.lv[l];
}
function openHowto(g){
  cur = g; sfx.click();
  var card = $('ht-card'); card.style.setProperty('--c', g.c); card.style.setProperty('--tc', g.tc);
  var tile = $('ht-tile'); tile.className = 'tile' + (g.small ? ' small' : '') + (g.emo ? ' emo' : ''); tile.textContent = g.glyph;
  $('ht-title').textContent = g.title;
  $('ht-concept').textContent = g.concept;
  $('ht-steps').innerHTML = g.steps.map(function(s){ return '<li>' + esc(s) + '</li>'; }).join('');
  setLevel(level);
  $('howto').hidden = false; $('ht-go').focus();
}
async function startGame(){
  $('howto').hidden = true;
  if(inst){ inst.destroy(); inst = null; }
  show('scr-game');
  var stage = $('stage'); stage.innerHTML = ''; stage.className = 'stage';
  document.querySelector('.time').style.setProperty('--c', cur.c);
  $('lvl-tag').textContent = LEVELS[level];
  var token = {};
  run = { token:token, running:false, score:0, lives:LIVES, streak:0, best:0, hits:0, miss:0, t0:0, raf:0, lastTick:-1, level:level };
  $('score').textContent = '0'; $('combo').classList.remove('on'); renderHearts(false);
  $('timefill').style.transform = 'scaleX(1)'; $('time').classList.remove('low');
  await wait(30);
  if(!run || run.token !== token) return;
  inst = cur.make(api, stage, level);
  var cd = document.createElement('div'); cd.className = 'count'; var n = document.createElement('span'); cd.appendChild(n); stage.appendChild(cd);
  var seq = ['3', '2', '1', 'Já!'];
  for(var i = 0; i < seq.length; i++){
    if(!run || run.token !== token) return;
    n.textContent = seq[i]; n.style.animation = 'none'; void n.offsetWidth; n.style.animation = '';
    if(i < 3) sfx.beep(); else sfx.go();
    await wait(i < 3 ? 600 : 420);
  }
  if(!run || run.token !== token) return;
  cd.remove();
  run.running = true; run.t0 = performance.now();
  inst.start();
  run.raf = requestAnimationFrame(clock);
}
function clock(){
  if(!api.running) return;
  var p = api.progress();
  $('timefill').style.transform = 'scaleX(' + (1 - p) + ')';
  var left = Math.ceil((1 - p) * DUR / 1000);
  if(left <= 10){
    $('time').classList.add('low');
    if(left !== run.lastTick && left > 0 && left <= 5){ run.lastTick = left; sfx.tick(); }
  }
  if(p >= 1){ finish('time'); return; }
  run.raf = requestAnimationFrame(clock);
}
async function finish(reason){
  if(!api.running) return;
  run.running = false; cancelAnimationFrame(run.raf);
  inst.stop();
  var b = document.createElement('div'); b.className = 'banner'; b.textContent = reason === 'lives' ? 'Sem vidas!' : 'Tempo! ⏱️';
  $('stage').appendChild(b);
  var mine = run;
  await wait(1300);
  if(run !== mine) return;
  showEnd(reason);
}
function showEnd(reason){
  if(inst){ inst.destroy(); inst = null; }
  var g = cur, s = run.score, L = run.level, m = g.medals.map(function(v){ return Math.round(v * MEDAL_SCALE[L] / 10) * 10; });
  $('end-head').textContent = reason === 'lives' ? 'Acabaram as vidas!' : 'Tempo esgotado!';
  $('end-game').textContent = g.title + ', nível ' + LEVELS[L].toLowerCase();
  $('final').textContent = s;
  var medal, rank, nextMsg = '';
  if(s >= m[2]){ medal = '🥇'; rank = L < 2 ? 'Craque! Que tal subir de nível?' : 'Gênio da matemática!'; }
  else if(s >= m[1]){ medal = '🥈'; rank = 'Mandou muito bem!'; nextMsg = 'Faltam ' + (m[2] - s) + ' pontos para o ouro.'; }
  else if(s >= m[0]){ medal = '🥉'; rank = 'Bom começo!'; nextMsg = 'Faltam ' + (m[1] - s) + ' pontos para a prata.'; }
  else { medal = '⭐'; rank = 'Muito bem por tentar! Vamos de novo?'; nextMsg = 'Faça ' + m[0] + ' pontos para ganhar o bronze.'; }
  $('medal').textContent = medal; $('rank').textContent = rank;
  $('stats').innerHTML = '<span>✅ ' + run.hits + (run.hits === 1 ? ' acerto' : ' acertos') + '</span><span>❌ ' + run.miss + (run.miss === 1 ? ' erro' : ' erros') + '</span><span>🔥 Sequência: ' + run.best + '</span>';
  var old = parseInt(store(recKey(g, L)) || '0', 10), recEl = $('record');
  if(s > old){ store(recKey(g, L), String(s)); recEl.textContent = (old ? '🎉 Novo recorde! (antes: ' + old + ')' : '🎉 Primeiro recorde neste nível!') + (nextMsg ? ' ' + nextMsg : ''); recEl.className = 'record new'; }
  else { recEl.textContent = 'Seu recorde: ' + old + '. ' + nextMsg; recEl.className = 'record'; }
  $('learn-title').textContent = 'Você praticou: ' + g.concept.toLowerCase();
  $('learn').textContent = g.learn;
  show('scr-end');
  if(s >= m[1]){ sfx.win(); confetti(); } else sfx.good();
}
function quit(){
  if(run){ run.running = false; run.token = null; cancelAnimationFrame(run.raf); }
  if(inst){ inst.stop(); inst.destroy(); inst = null; }
  renderMenu(); show('scr-menu');
}

function confetti(){
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var cv = $('confetti'), ctx = cv.getContext('2d'), d = Math.min(2, window.devicePixelRatio || 1);
  cv.width = innerWidth * d; cv.height = innerHeight * d; ctx.setTransform(d, 0, 0, d, 0, 0);
  var cols = ['#ff5c8a', '#3d8bff', '#2fcf86', '#ffc93c', '#ff8c42'], ps = [];
  for(var i = 0; i < 140; i++) ps.push({ x:Math.random() * innerWidth, y:-20 - Math.random() * innerHeight * .5, vx:(Math.random() - .5) * 120, vy:120 + Math.random() * 200, r:Math.random() * 6, vr:(Math.random() - .5) * 10, c:pick(cols), w:8 + Math.random() * 6 });
  var t0 = performance.now(), last = t0;
  (function f(now){
    var dt = Math.min(.05, (now - last) / 1000); last = now;
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    ps.forEach(function(p){ p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.vr * dt; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -3, p.w, 6); ctx.restore(); });
    if(now - t0 < 3500) requestAnimationFrame(f); else ctx.clearRect(0, 0, innerWidth, innerHeight);
  })(t0);
}

/* eventos */
$('ht-go').addEventListener('click', startGame);
$('ht-back').addEventListener('click', function(){ $('howto').hidden = true; sfx.click(); });
$('howto').addEventListener('click', function(e){ if(e.target === this){ this.hidden = true; } });
$('lv').addEventListener('click', function(e){ var b = e.target.closest('button'); if(b){ sfx.click(); setLevel(parseInt(b.dataset.l, 10)); } });
$('btn-home').addEventListener('click', function(){ sfx.click(); quit(); });
$('btn-again').addEventListener('click', function(){ sfx.click(); startGame(); });
$('btn-menu').addEventListener('click', function(){ sfx.click(); renderMenu(); show('scr-menu'); });
$('btn-level').addEventListener('click', function(){ renderMenu(); show('scr-menu'); openHowto(cur); });
$('mute').addEventListener('click', function(){ setMuted(!muted); });
$('mute-menu').addEventListener('click', function(){ setMuted(!muted); });
window.addEventListener('keydown', function(e){
  if(e.key === 'Escape'){ if(!$('howto').hidden) $('howto').hidden = true; }
  if(e.key === 'Enter' && !$('howto').hidden && !e.target.closest('button')){ e.preventDefault(); startGame(); }
});
setMuted(muted);
renderMenu();
})();
</script>
